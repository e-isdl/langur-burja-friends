<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Teen Patti — Langur Burja Friends</title>
<link rel="stylesheet" href="../shell.css">
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@600;700&display=swap" rel="stylesheet">
<script src="../shared/sound.js"></script>
<script src="../shared/deck.js"></script>
<script src="../shared/ws-client.js"></script>
<style>
:root{--gold:#d4af37;--gold2:#f5d67b;--bg:#0e0d0b;--bg2:#171410;--card:#1f1a13;--mut:#9a8c6b;--green:#1d5c3f;--red:#a33}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;padding:0;background:var(--bg);color:#f3e9cf;font-family:system-ui,-apple-system,Segoe UI,Roboto,sans-serif;min-height:100vh}
body{max-width:480px;margin:0 auto;border-left:1px solid #2a241a;border-right:1px solid #2a241a;min-height:100vh;display:flex;flex-direction:column}
.topbar{display:flex;align-items:center;gap:8px;padding:10px 12px;background:linear-gradient(180deg,#1c1710,#12100c);border-bottom:1px solid var(--gold);position:sticky;top:0;z-index:20}
.topbar button{background:#241d12;border:1px solid var(--gold);color:var(--gold2);border-radius:8px;padding:6px 10px;font-size:14px;cursor:pointer}
.title{font-family:'Playfair Display',serif;color:var(--gold2);font-size:19px;flex:1;text-align:center;letter-spacing:.5px}
.chips-pill{background:#000;border:1px solid var(--gold);border-radius:20px;padding:4px 10px;font-size:13px;color:var(--gold2);white-space:nowrap}
.layout{display:flex;flex:1;min-height:0}
#players{width:108px;background:var(--bg2);border-right:1px solid #2a241a;padding:8px 6px;display:flex;flex-direction:column;gap:8px;overflow-y:auto}
.pl{background:#14110d;border:1px solid #333;border-radius:10px;padding:6px;font-size:12px}
.pl.active{border-color:var(--gold);box-shadow:0 0 10px rgba(212,175,55,.55)}
.pl .nm{font-weight:700;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.pl .ch{color:var(--gold2);font-size:12px}
.pl .st{font-size:11px;color:var(--mut)}
.pl.folded{opacity:.45}
.pl .dealer{font-size:10px;color:#000;background:var(--gold);border-radius:6px;padding:0 4px;margin-left:4px}
.tablewrap{flex:1;display:flex;flex-direction:column;padding:10px;gap:10px;min-width:0}
#timerBar{height:6px;background:#2a241a;border-radius:4px;overflow:hidden}
#timerFill{height:100%;width:100%;background:linear-gradient(90deg,var(--gold),#ffefb0);transition:width 1s linear}
#potBox{text-align:center;background:radial-gradient(circle at 50% 30%,#2a2214,#12100c);border:1px solid var(--gold);border-radius:14px;padding:8px}
#potVal{font-size:22px;color:var(--gold2);font-weight:800}
#stakeInfo{font-size:12px;color:var(--mut)}
#oppArea{display:flex;flex-wrap:wrap;gap:8px;justify-content:center;min-height:64px}
.opp{background:#14110d;border:1px solid #3a3120;border-radius:10px;padding:6px 8px;font-size:12px;min-width:88px;text-align:center}
.opp.active{border-color:var(--gold);box-shadow:0 0 8px rgba(212,175,55,.5)}
.facedown{display:flex;gap:4px;justify-content:center;margin-top:4px}
.mini-back{width:22px;height:32px;background:linear-gradient(135deg,#5a1010,#1a0d0d);border:1px solid var(--gold);border-radius:4px;display:inline-block}
#myHandArea{text-align:center}
#myCards{display:flex;gap:10px;justify-content:center;margin:8px 0;min-height:96px}
.card{width:64px;height:92px;border-radius:10px;background:linear-gradient(180deg,#fffdf5,#f0e6c8);color:#111;display:flex;flex-direction:column;align-items:center;justify-content:center;font-weight:800;font-size:20px;border:2px solid var(--gold);box-shadow:0 4px 12px rgba(0,0,0,.5);user-select:none}
.card.red{color:#b01e1e}
.card.back{background:linear-gradient(135deg,#5a1010 0%,#241010 60%,#0e0d0b 100%);color:var(--gold2);font-size:28px}
.card.small{width:44px;height:64px;font-size:15px}
.card.large{width:84px;height:120px;font-size:28px}
#handRank{font-size:13px;color:var(--gold2);min-height:18px}
.controls{position:sticky;bottom:0;background:#12100c;border-top:1px solid var(--gold);padding:10px;display:flex;flex-direction:column;gap:8px}
.betrow{display:flex;gap:8px}
.betrow button,.actionrow button{flex:1;background:linear-gradient(180deg,#2b2314,#1a140c);border:1px solid var(--gold);color:var(--gold2);border-radius:10px;padding:11px 6px;font-size:14px;font-weight:700;cursor:pointer}
.betrow button:disabled,.actionrow button:disabled{opacity:.35}
.actionrow{display:flex;gap:8px}
#seeBtn{background:#0f2a1f}
#msg{min-height:20px;font-size:13px;color:#ffe9a8;text-align:center}
#overlay{position:fixed;inset:0;background:rgba(0,0,0,.78);display:none;align-items:center;justify-content:center;z-index:50;padding:16px}
#overlay.show{display:flex}
.sheet{background:#171310;border:1px solid var(--gold);border-radius:16px;padding:18px;max-width:360px;width:100%;text-align:center}
.sheet h2{font-family:'Playfair Display',serif;color:var(--gold2);margin:0 0 8px}
.sheet p{font-size:14px}
.sheet .row{display:flex;gap:8px;margin-top:12px}
.sheet .row button{flex:1;padding:11px;border-radius:10px;border:1px solid var(--gold);background:#241d12;color:var(--gold2);font-weight:700}
@media(min-width:420px){.card{width:70px;height:100px}}
</style>
</head>
<body>
<div class="topbar">
<button id="backBtn">←</button>
<div class="title">Teen Patti</div>
<div class="chips-pill">🪙 <span id="chipsMe">500</span></div>
<button id="muteBtn">🔊</button>
</div>
<div class="layout">
<aside id="players"></aside>
<div class="tablewrap">
<div id="timerBar"><div id="timerFill"></div></div>
<div id="potBox">POT<div id="potVal">0</div><div id="stakeInfo">Boot 10 • Stake 10</div></div>
<div id="oppArea"></div>
<div id="myHandArea">
<div style="font-size:12px;color:#9a8c6b">Your hand <span id="blindTag"></span></div>
<div id="myCards"></div>
<div id="handRank"></div>
</div>
<div id="msg">Connecting…</div>
</div>
</div>
<div class="controls">
<div class="betrow">
<button id="blindBtn">Blind (½)</button>
<button id="chaalBtn">Chaal (Full)</button>
<button id="raiseBtn">Raise +10</button>
</div>
<div class="actionrow">
<button id="seeBtn">See Cards</button>
<button id="showBtn">Show</button>
<button id="sideshowBtn">SideShow</button>
<button id="foldBtn">Fold</button>
</div>
</div>
<div id="overlay"><div class="sheet">
<h2 id="resultTitle">Winner</h2>
<p id="resultText"></p>
<div id="resultHands" style="display:flex;gap:6px;justify-content:center;margin:8px 0"></div>
<div class="row"><button id="nextBtn">Next Hand</button><button id="lobbyBtn">Back to Lobby</button></div>
</div></div>
<script src="./teen-patti.js"></script>
</body>
</html>
